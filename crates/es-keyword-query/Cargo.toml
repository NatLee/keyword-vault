[package]
name = "es-keyword-query"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A compact boolean keyword syntax (& | ! ~) that compiles to an Elasticsearch / OpenSearch query_string."
license = "MIT"
repository = "https://github.com/NatLee/es-keyword-query"
readme = "README.md"
keywords = ["elasticsearch", "opensearch", "lucene", "query", "parser"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
unicode-normalization = "0.1.26"

[dev-dependencies]
serde_json = "1"
