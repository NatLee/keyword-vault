<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">Keyword Vault — the team expression library</title><desc id="desc">Collect, compose and refine reusable boolean search expressions in a shared workspace.</desc><rect width="1600" height="800" fill="#242a23"/><rect width="1600" height="9" fill="#e3aa36"/><g font-family="monospace"><text x="90" y="110" fill="#e3aa36" font-size="18" letter-spacing="5">THE TEAM’S EXPRESSION LIBRARY</text><text x="86" y="265" fill="#f3f1e7" font-size="112" font-weight="bold" letter-spacing="-6">Keyword Vault</text><text x="92" y="335" fill="#b8c0ad" font-size="27">Collect. Compose. Refine.</text><path d="M90 400h1420M90 686h1420" stroke="#536047"/><text x="90" y="450" fill="#a0ad91" font-size="16">001 / SHARED EXPRESSION</text><text x="90" y="530" fill="#f3f1e7" font-size="38">(tea <tspan fill="#e3aa36">|</tspan> coffee) <tspan fill="#e3aa36">&amp;</tspan> review <tspan fill="#e3aa36">!</tspan> ad</text><text x="92" y="610" fill="#b8c0ad" font-size="18">Your search knowledge, ready to reuse.</text><g fill="#e3aa36" font-size="16"><text x="1080" y="452">01   VALIDATE</text><text x="1080" y="508">02   VERSION</text><text x="1080" y="564">03   COMBINE</text><text x="1080" y="620">04   SHARE</text></g><text x="90" y="744" fill="#a0ad91" font-size="15" letter-spacing="3">RUST + REACT + SQLITE</text><text x="1160" y="744" fill="#a0ad91" font-size="15" letter-spacing="3">SELF-HOSTED / MIT</text></g></svg>