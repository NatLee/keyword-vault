[package]
name = "keyword-vault"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Self-hosted library for boolean search keywords: write, validate, version, combine and share Elasticsearch / OpenSearch query_string expressions"
publish = false

[lib]
name = "keyword_vault"
path = "src/lib.rs"

[[bin]]
name = "keyword-vault"
path = "src/main.rs"

[dependencies]
url = "2"
access-kit = { path = "../../crates/access-kit" }
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
jieba-rs = { version = "=0.11.0", default-features = false }
# Shared workspace compiler; no duplicate parser source.
es-keyword-query = { path = "../../crates/es-keyword-query" }
# OsRng：密碼的 salt 和 session token 用作業系統的亂數
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "=3.12.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
sdk-reqwest = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "rustls"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

