[package]
name = "keyword-vault"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Self-hosted library for boolean search keywords: write, validate, version, combine and share Elasticsearch / OpenSearch query_string expressions"
publish = false

[lib]
name = "keyword_vault"
path = "src/lib.rs"

[[bin]]
name = "keyword-vault"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
# 關鍵字語法的解析器。該專案公開前先放一份在 vendor/，之後改成 git 或 crates.io 的版本。
es-keyword-query = { path = "vendor/es-keyword-query" }
# OsRng：密碼的 salt 和 session token 用作業系統的亂數
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# 密碼雜湊在未最佳化的 build 很慢；讓測試跑快一點。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
